# Verificacao de todo push e de todo PR.
#
# Custo: repositorio privado no plano Free tem 2.000 minutos de Actions por mes,
# e esta suite roda em cerca de um minuto. Fica folgado dentro do gratuito, que e
# a regra de custo do projeto (CLAUDE.md, "priorizar o gratuito").
#
# A ordem e proposital: lint e o mais rapido e pega erro bobo antes de gastar
# tempo em teste; o build vem por ultimo porque um bundle que compila com teste
# quebrado nao serve de nada.

name: Verificação

on:
  push:
    branches: ['**']
  pull_request:

# Push novo na mesma branch cancela a execucao anterior: ninguem precisa do
# resultado de um commit que ja foi substituido, e minuto de Actions e finito.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` e nao `npm install`: instala exatamente o que esta no lockfile.
      # Instalar versao diferente da que o desenvolvedor testou transforma o CI
      # num ambiente que nao existe em lugar nenhum.
      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
